[package]
name = "rookshelf"
version = "0.1.0"
edition = "2021"
description = "Home library cataloger: scan ISBNs, auto-categorize, chart your shelves"

[dependencies]
eframe = "0.36"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
